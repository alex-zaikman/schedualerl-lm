services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-schedulerlm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev}
      POSTGRES_DB: ${DB_NAME:-schedulerlm}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-schedulerlm} -d ${DB_NAME:-schedulerlm}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    entrypoint: ["/app/scripts/docker-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
